name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'java-interview-web' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Deploy Worker
        working-directory: server
        run: npx wrangler deploy

      - name: Update model secret
        if: ${{ secrets.MODEL_API_KEY != '' }}
        working-directory: server
        run: printf '%s' "$MODEL_API_KEY" | npx wrangler secret put MODEL_API_KEY
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}

      - name: Build frontend
        working-directory: web
        run: test -n "$VITE_API_BASE_URL" && npm run build

      - name: Deploy Pages
        working-directory: web
        run: npx wrangler pages deploy dist --project-name "$CF_PAGES_PROJECT"
